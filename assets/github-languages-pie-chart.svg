        <text class="txt_7" x="260" y="270" fill="RosyBrown" stroke="RosyBrown" stroke-width="1" >MATLAB</text>

        
        
        <!-- C++ -->
        <path class="path_8" d="M 60,120 L 16.288423334906668,30.05947484336292 A 100,100 0 0 1 24.946567980874008,26.345011325180806 Z" fill="RoyalBlue" stroke="#fff" stroke-width="2"></path>
